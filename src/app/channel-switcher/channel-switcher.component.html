<!-- Channel Switcher Overlay Panel -->
<div class="channel-switcher-backdrop" *ngIf="isOpen" (click)="closePanel()">
  <div class="channel-switcher-panel" (click)="$event.stopPropagation()">
    
    <!-- Panel Header -->
    <div class="cs-header">
      <div class="cs-header-left">
        <button 
          *ngIf="selectedGroup || searchQuery" 
          class="cs-back-btn" 
          (click)="goBackToGroups()" 
          title="Back to categories">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
          </svg>
        </button>
        <h3 class="cs-title">
          {{ selectedGroup ? selectedGroup.name : 'Live TV Channels' }}
        </h3>
      </div>
      <button class="cs-close-btn" (click)="closePanel()" title="Close">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z" />
        </svg>
      </button>
    </div>

    <!-- Search Bar -->
    <div class="cs-search-bar">
      <svg class="cs-search-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
      </svg>
      <input 
        type="text" 
        class="cs-search-input" 
        placeholder="Search channels..." 
        [(ngModel)]="searchQuery" 
        (input)="onSearch()"
        autocomplete="off" />
    </div>

    <!-- Loading -->
    <div class="cs-loading" *ngIf="loading">
      <div class="spinner-border spinner-border-sm text-info" role="status"></div>
      <span>Loading...</span>
    </div>

    <!-- Category Groups List -->
    <div class="cs-list" *ngIf="!loading && !selectedGroup && groups.length > 0 && !searchQuery">
      <button 
        *ngFor="let group of groups; trackBy: trackByGroupId" 
        class="cs-group-item" 
        (click)="selectGroup(group)">
        <svg class="cs-group-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z" />
        </svg>
        <span class="cs-group-name">{{ group.name }}</span>
        <svg class="cs-chevron" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z" />
        </svg>
      </button>
    </div>

    <!-- Channels List -->
    <div class="cs-list" *ngIf="!loading && (selectedGroup || groups.length === 0 || searchQuery) && channels.length > 0">
      <button 
        *ngFor="let ch of channels; trackBy: trackByChannelId" 
        class="cs-channel-item" 
        [class.cs-active]="isCurrentChannel(ch)"
        (click)="selectChannel(ch)">
        <div class="cs-channel-logo-wrap">
          <img 
            *ngIf="ch.image" 
            [src]="ch.image" 
            alt="" 
            class="cs-channel-logo" 
            (error)="$any($event.target).style.display='none'" />
          <div *ngIf="!ch.image" class="cs-channel-logo-fallback">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.16,3L6.75,4.41L9.34,7H4C2.89,7 2,7.89 2,9V19C2,20.1 2.89,21 4,21H20C21.1,21 22,20.1 22,19V9C22,7.89 21.1,7 20,7H14.66L17.25,4.41L15.84,3L12,6.84L8.16,3M4,9H20V19H4V9Z" />
            </svg>
          </div>
        </div>
        <span class="cs-channel-name">{{ ch.name }}</span>
        <div class="cs-now-playing" *ngIf="isCurrentChannel(ch)">
          <span class="cs-live-dot"></span>
          <span>Playing</span>
        </div>
      </button>
    </div>

    <!-- Empty State -->
    <div class="cs-empty" *ngIf="!loading && ((selectedGroup || searchQuery) && channels.length === 0)">
      <p>No channels found.</p>
    </div>

  </div>
</div>
