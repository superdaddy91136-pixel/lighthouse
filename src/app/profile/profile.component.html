<svg (click)="goBack()" class="arrow" fill="currentColor" viewBox="0 0 24 24">
  <path
    d="M2,12A10,10 0 0,1 12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12M18,11H10L13.5,7.5L12.08,6.08L6.16,12L12.08,17.92L13.5,16.5L10,13H18V11Z" />
</svg>
<div class="container px-md-5 px-3">
  <!-- Profile Section Tabs Header -->
  <div class="profile-header text-center mt-3 mb-4">
    <h2 class="profile-title mb-3">Profile</h2>
    <div class="profile-nav-pill mx-auto">
      <button 
        type="button" 
        class="profile-pill-btn" 
        [class.active]="activeSection === 'favorites'" 
        (click)="setSection('favorites')">
        <svg class="pill-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
        </svg>
        <span>Favorites</span>
        <span class="pill-badge" *ngIf="favoriteChannels.length > 0">{{ favoriteChannels.length }}</span>
      </button>
      <button 
        type="button" 
        class="profile-pill-btn" 
        [class.active]="activeSection === 'history'" 
        (click)="setSection('history')">
        <svg class="pill-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" />
        </svg>
        <span>Watch History</span>
        <span class="pill-badge" *ngIf="historyChannels.length > 0">{{ historyChannels.length }}</span>
      </button>
    </div>
  </div>

  <!-- SECTION 1: FAVORITES -->
  <div *ngIf="activeSection === 'favorites'" class="favorites-section">
    <div class="fav-controls-row mb-4">
      <div class="fav-search-wrapper">
        <input 
          type="text" 
          [(ngModel)]="favSearchQuery" 
          (ngModelChange)="filterFavorites()" 
          placeholder="Filter favorite channels..." 
          class="form-control fav-search-input" />
      </div>
      <div class="fav-filter-pills">
        <button class="fav-filter-btn" [class.active]="favMediaType === -1" (click)="setFavMediaType(-1)">All</button>
        <button class="fav-filter-btn" [class.active]="favMediaType === 0" (click)="setFavMediaType(0)">Live TV</button>
        <button class="fav-filter-btn" [class.active]="favMediaType === 1" (click)="setFavMediaType(1)">Movies</button>
        <button class="fav-filter-btn" [class.active]="favMediaType === 2" (click)="setFavMediaType(2)">Series</button>
      </div>
      <button class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center fav-reload-btn" (click)="loadFavorites()" title="Reload Favorites">
        <svg class="refresh-sm" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
        </svg>
      </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredFavorites.length === 0 && !loadingFavorites" class="empty-fav-card text-center py-5">
      <svg class="empty-star mb-3" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z" />
      </svg>
      <h5 class="text-white mb-2">No Favorite Channels</h5>
      <p class="text-secondary small">Right-click any channel card in Home, Live TV, Movies, or TV Shows to add it to your Favorites.</p>
    </div>

    <!-- Favorite Channel Grid -->
    <div class="row gy-3" *ngIf="filteredFavorites.length > 0">
      <app-channel-tile 
        *ngFor="let channel of filteredFavorites; let i = index"
        class="col-lg-4 col-md-6 col-12" 
        [id]="i" 
        [channel]="channel" 
        [viewMode]="viewModeEnum.Favorites">
      </app-channel-tile>
    </div>
  </div>

  <!-- SECTION 2: WATCH HISTORY -->
  <div *ngIf="activeSection === 'history'" class="history-section">
    <div class="fav-controls-row mb-4">
      <div class="fav-search-wrapper">
        <input 
          type="text" 
          [(ngModel)]="historySearchQuery" 
          (ngModelChange)="filterHistory()" 
          placeholder="Filter watch history..." 
          class="form-control fav-search-input" />
      </div>
      <div class="fav-filter-pills">
        <button class="fav-filter-btn" [class.active]="historyMediaType === -1" (click)="setHistoryMediaType(-1)">All</button>
        <button class="fav-filter-btn" [class.active]="historyMediaType === 0" (click)="setHistoryMediaType(0)">Live TV</button>
        <button class="fav-filter-btn" [class.active]="historyMediaType === 1" (click)="setHistoryMediaType(1)">Movies</button>
        <button class="fav-filter-btn" [class.active]="historyMediaType === 2" (click)="setHistoryMediaType(2)">Series</button>
      </div>
      <button class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center fav-reload-btn" (click)="loadHistory()" title="Reload History">
        <svg class="refresh-sm" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
        </svg>
      </button>
      <button 
        *ngIf="historyChannels.length > 0"
        class="btn btn-sm btn-outline-danger d-inline-flex align-items-center ms-auto" 
        (click)="clearHistory()" 
        title="Clear Watch History">
        Clear History
      </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredHistory.length === 0 && !loadingHistory" class="empty-fav-card text-center py-5">
      <svg class="empty-star mb-3" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3" />
      </svg>
      <h5 class="text-white mb-2">No Watch History</h5>
      <p class="text-secondary small">Channels and videos you watch will show up here.</p>
    </div>

    <!-- History Channel Grid -->
    <div class="row gy-3" *ngIf="filteredHistory.length > 0">
      <app-channel-tile 
        *ngFor="let channel of filteredHistory; let i = index"
        class="col-lg-4 col-md-6 col-12" 
        [id]="i" 
        [channel]="channel" 
        [viewMode]="viewModeEnum.History">
      </app-channel-tile>
    </div>
  </div>
</div>
