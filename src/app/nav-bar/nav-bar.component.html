<nav class="floating-nav" aria-label="Main Navigation">
  <div class="nav-brand" title="Fred TV">
    <svg class="nav-brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="6" width="20" height="15" rx="3"/>
      <path d="m16 2-4 4-4-4"/>
      <circle cx="12" cy="13.5" r="2.5" fill="currentColor"/>
    </svg>
  </div>

  <div class="nav-tabs-group">
    <!-- 1. Home -->
    <button
      type="button"
      class="nav-tab-btn"
      [class.active]="activeTab === navTabEnum.Home"
      (click)="selectTab(navTabEnum.Home)"
      title="Home"
      id="nav-tab-home"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        <path d="M9 22V12h6v10"/>
      </svg>
      <span class="tab-label">Home</span>
    </button>

    <!-- 2. Live TV -->
    <button
      type="button"
      class="nav-tab-btn"
      [class.active]="activeTab === navTabEnum.LiveTV"
      (click)="selectTab(navTabEnum.LiveTV)"
      title="Live TV"
      id="nav-tab-live"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="3"/>
        <path d="M17 2l-5 5-5-5"/>
        <circle cx="17" cy="11.5" r="1.5" fill="currentColor"/>
      </svg>
      <span class="tab-label">Live TV</span>
    </button>

    <!-- 3. Movies -->
    <button
      type="button"
      class="nav-tab-btn"
      [class.active]="activeTab === navTabEnum.Movies"
      (click)="selectTab(navTabEnum.Movies)"
      title="Movies"
      id="nav-tab-movies"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="3"/>
        <path d="M7 4v16"/>
        <path d="M17 4v16"/>
        <path d="M2 12h20"/>
        <path d="M2 8h5"/>
        <path d="M2 16h5"/>
        <path d="M17 8h5"/>
        <path d="M17 16h5"/>
      </svg>
      <span class="tab-label">Movies</span>
    </button>

    <!-- 4. TV Shows -->
    <button
      type="button"
      class="nav-tab-btn"
      [class.active]="activeTab === navTabEnum.TVShows"
      (click)="selectTab(navTabEnum.TVShows)"
      title="TV Shows"
      id="nav-tab-series"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="14" rx="3"/>
        <polygon points="10,8 16,11 10,14" fill="currentColor" stroke="none"/>
        <path d="M6 21h12"/>
        <path d="M12 18v3"/>
      </svg>
      <span class="tab-label">TV Shows</span>
    </button>

    <!-- 5. Profile -->
    <button
      type="button"
      class="nav-tab-btn"
      [class.active]="activeTab === navTabEnum.Profile"
      (click)="selectTab(navTabEnum.Profile)"
      title="Profile"
      id="nav-tab-profile"
    >
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span class="tab-label">Profile</span>
    </button>
  </div>
</nav>
